<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2925" stroke-width="0.5"></path>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.3"></feGaussianBlur>
    </filter>
  </defs>

  
  <rect width="400" height="300" fill="#15140f"></rect>
  <rect width="400" height="300" fill="url(#grid)"></rect>

  
  <g stroke="#6b6760" stroke-width="0.8" fill="none">
    <path d="M 20 20 L 35 20 M 20 20 L 20 35"></path>
    <path d="M 380 20 L 365 20 M 380 20 L 380 35"></path>
    <path d="M 20 280 L 35 280 M 20 280 L 20 265"></path>
    <path d="M 380 280 L 365 280 M 380 280 L 380 265"></path>
  </g>

  
  <g transform="translate(200,150)">
    <circle r="36" fill="#0e0e0d" stroke="#e0653a" stroke-width="1.2"></circle>
    <circle r="50" fill="none" stroke="#e0653a" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"></circle>
    <circle r="66" fill="none" stroke="#e0653a" stroke-width="0.4" stroke-dasharray="1 4" opacity="0.3"></circle>
    <text y="2" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#f4f0e6" letter-spacing="1">MESH</text>
    <text y="14" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#a8a399" letter-spacing="0.5">GATEWAY</text>
  </g>

  
  <g font-family="JetBrains Mono, monospace" font-size="7" fill="#a8a399" letter-spacing="0.5">
    
    <g transform="translate(60,70)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">SVC / 01</text>
    </g>
    <g transform="translate(50,150)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">SVC / 02</text>
    </g>
    <g transform="translate(60,230)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">SVC / 03</text>
    </g>
    
    <g transform="translate(340,70)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">API / 24</text>
    </g>
    <g transform="translate(350,150)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">API / 48</text>
    </g>
    <g transform="translate(340,230)">
      <rect x="-28" y="-10" width="56" height="20" fill="#0e0e0d" stroke="#2a2925"></rect>
      <text text-anchor="middle" y="3">API / 68</text>
    </g>
  </g>

  
  <g stroke="#e0653a" stroke-width="0.6" fill="none" opacity="0.7">
    <path d="M 88 70 Q 140 90 166 138"></path>
    <path d="M 78 150 L 164 150"></path>
    <path d="M 88 230 Q 140 210 166 162"></path>
    <path d="M 312 70 Q 260 90 234 138"></path>
    <path d="M 322 150 L 236 150"></path>
    <path d="M 312 230 Q 260 210 234 162"></path>
  </g>

  
  <g fill="#e0653a">
    <circle cx="128" cy="104" r="1.2"></circle>
    <circle cx="272" cy="104" r="1.2"></circle>
    <circle cx="120" cy="150" r="1"></circle>
    <circle cx="280" cy="150" r="1"></circle>
    <circle cx="128" cy="196" r="1.2"></circle>
    <circle cx="272" cy="196" r="1.2"></circle>
  </g>

  
  <g font-family="JetBrains Mono, monospace" font-size="6" fill="#6b6760" letter-spacing="1.2">
    <text x="20" y="14">/ FIG.01 — API GATEWAY ARCHITECTURE</text>
    <text x="380" y="14" text-anchor="end">OPENGOV / 68 APIS</text>
    <text x="20" y="294">/ GRAPHQL MESH</text>
    <text x="380" y="294" text-anchor="end">PUBLIC API PLATFORM</text>
  </g>

  
  <rect width="400" height="300" fill="url(#stripes)" opacity="0.06"></rect>
  <defs>
    <pattern id="stripes" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#e0653a" stroke-width="1"></line>
    </pattern>
  </defs>
</svg>